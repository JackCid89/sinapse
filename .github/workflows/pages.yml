name: Deploy SINAPSE to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Opt-in a Node.js 24 antes de que GitHub lo fuerce el 2 de junio 2026.
# Quita el warning "Node.js 20 actions are deprecated" en cada run.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Validate registro.json
        run: |
          python3 -c "import json; json.load(open('data/registro.json'))"
          echo "registro.json válido"

      - name: Validate issues (estructura, accesibilidad, datos, geometría, editorial)
        run: python3 scripts/validate-issue.py --site .

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
